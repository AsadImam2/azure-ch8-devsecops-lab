name: Azure OIDC Authentication Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/azure-oidc-test.yml"

permissions:
  contents: read
  id-token: write

jobs:
  azure-oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity and Resource Group access
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" --output table
          az group show --name rg-ch8-devsecops-lab --query "{name:name, location:location, state:properties.provisioningState}" --output table
